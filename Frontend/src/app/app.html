@if (auth.isLoggedIn()) {
  <header class="topbar">
    <a class="brand" routerLink="/descubrir">
      <img class="brand-logo" src="logo-placard.png" alt="PLACARD S.A." />
    </a>

    <nav class="links">
      <a routerLink="/descubrir" routerLinkActive="active">Descubrir</a>
      <a routerLink="/explorar" routerLinkActive="active">Explorar</a>
      <a routerLink="/closet" routerLinkActive="active">Mi clóset</a>
      <a routerLink="/matches" routerLinkActive="active">Matches</a>
      @if (auth.isAdmin()) {
        <a routerLink="/admin" routerLinkActive="active">Admin</a>
      }
    </nav>

    <div class="user">
      <span class="geo-pill" [class.off]="!auth.hasLocation()" [title]="geoTitle()">
        📍 {{ auth.hasLocation() ? 'Ubicación activa' : 'Sin ubicación' }}
      </span>
      <a routerLink="/perfil" class="user-link">
        <img class="avatar" [src]="auth.user()?.avatar_url || fallbackAvatar" alt="" />
        <span class="user-name">{{ auth.user()?.username }}</span>
      </a>
      <button type="button" class="btn btn-ghost btn-sm" (click)="auth.logout()">Salir</button>
    </div>
  </header>
}

<main>
  <router-outlet />
</main>

@if (auth.isLoggedIn() && !auth.hasLocation()) {
  <button type="button" class="geo-fab" (click)="enableLocation()" [disabled]="locating()">
    <span class="pin">📍</span>
    <span>{{ locating() ? 'Buscando…' : 'Activar ubicación' }}</span>
  </button>
}

@if (locationError()) {
  <div class="geo-toast" role="alert">
    {{ locationError() }}
    <button type="button" (click)="locationError.set('')">✕</button>
  </div>
}
